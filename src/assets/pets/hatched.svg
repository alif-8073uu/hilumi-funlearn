
        <svg xmlns="http://www.w3.org/2000/svg" class="anim-float" viewBox="-20 -35 260 325" width="180" height="210">
          <style>
@keyframes float {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-14px) rotate(2deg); }
}

@keyframes pulse-glow {
  0%, 100% { opacity: 0.4; transform: scale(0.96); }
  50% { opacity: 0.85; transform: scale(1.08); }
}

@keyframes egg-wobble {
  0%, 100% { transform: rotate(0deg) scale(1); }
  25% { transform: rotate(-6deg) scale(1.02); }
  75% { transform: rotate(6deg) scale(0.98); }
}

@keyframes tentacle-sway {
  0%, 100% { transform: rotate(-8deg); }
  50% { transform: rotate(8deg); }
}

@keyframes blink {
  0%, 94%, 100% { transform: scaleY(1); }
  97% { transform: scaleY(0.1); }
}

@keyframes super-aura {
  0% { transform: rotate(0deg) scale(1); filter: hue-rotate(0deg); }
  50% { transform: rotate(180deg) scale(1.15); filter: hue-rotate(180deg); }
  100% { transform: rotate(360deg) scale(1); filter: hue-rotate(360deg); }
}

@keyframes sparkle-rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.anim-float { animation: float 3.5s ease-in-out infinite; }
.anim-egg { animation: egg-wobble 2.2s ease-in-out infinite; }
.anim-pulse { animation: pulse-glow 2.5s ease-in-out infinite; }
.anim-super { animation: super-aura 6s linear infinite; }
.anim-sparkle { animation: sparkle-rotate 12s linear infinite; }

.eye-blink {
  transform-origin: center;
  transform-box: fill-box;
  animation: blink 4s infinite;
}

.tentacle {
  transform-origin: top center;
  transform-box: fill-box;
  animation: tentacle-sway var(--speed, 2.5s) ease-in-out infinite;
  animation-delay: var(--delay, 0s);
}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs>
            <linearGradient id="babyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#a7f3d0"/>
              <stop offset="100%" stop-color="#34d399"/>
            </linearGradient>
          </defs>
          <!-- Tentacles -->
          <g>
            <path class="tentacle" style="--delay:0s;" d="M75,130 Q65,165 78,190" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
            <path class="tentacle" style="--delay:0.3s;" d="M92,135 Q90,170 96,195" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
            <path class="tentacle" style="--delay:0.6s;" d="M108,135 Q110,170 104,195" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
            <path class="tentacle" style="--delay:0.9s;" d="M125,130 Q135,165 122,190" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
          </g>
          <!-- Main Head -->
          <path d="M45,110 C45,55 70,45 100,45 C130,45 155,55 155,110 C155,128 135,130 120,126 C108,123 92,123 80,126 C65,130 45,128 45,110 Z" fill="url(#babyGrad)" stroke="#059669" stroke-width="3"/>
          <!-- Shine -->
          <ellipse cx="75" cy="65" rx="10" ry="6" fill="#fff" opacity="0.6" transform="rotate(-20 75 65)"/>
          <!-- Blush -->
          <circle cx="70" cy="105" r="7" fill="#f43f5e" opacity="0.4"/>
          <circle cx="130" cy="105" r="7" fill="#f43f5e" opacity="0.4"/>
          <!-- Eyes -->
          <g class="eye-blink">
            <circle cx="80" cy="95" r="7" fill="#0f172a"/>
            <circle cx="82" cy="92" r="2.5" fill="#fff"/>
            <circle cx="120" cy="95" r="7" fill="#0f172a"/>
            <circle cx="122" cy="92" r="2.5" fill="#fff"/>
          </g>
          <!-- Mouth -->
          <path d="M94,103 Q100,109 106,103" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
          <!-- Little Shell Shell Accent -->
          <circle cx="100" cy="45" r="5" fill="#fbbf24"/>
        </svg>
      