          </g>
          <!-- Happy Mouth -->
          <path d="M92,97 Q100,108 108,97 Z" fill="#0f172a"/>
          <!-- Head Gem Accent -->
          <polygon points="100,20 106,30 100,40 94,30" fill="#fbbf24"/>
        </svg>
      