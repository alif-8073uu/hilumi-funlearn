
        <svg xmlns="http://www.w3.org/2000/svg" class="anim-float" viewBox="-20 -35 260 325" width="180" height="210">
          <style>
@keyframes float {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-14px) rotate(2deg); }
}

@keyframes pulse-glow {
  0%, 100% { opacity: 0.4; transform: scale(0.96); }
  50% { opacity: 0.85; transform: scale(1.08); }
}

@keyframes egg-wobble {
  0%, 100% { transform: rotate(0deg) scale(1); }
  25% { transform: rotate(-6deg) scale(1.02); }
  75% { transform: rotate(6deg) scale(0.98); }
}

@keyframes tentacle-sway {
  0%, 100% { transform: rotate(-8deg); }
  50% { transform: rotate(8deg); }
}

@keyframes blink {
  0%, 94%, 100% { transform: scaleY(1); }
  97% { transform: scaleY(0.1); }
}

@keyframes super-aura {
  0% { transform: rotate(0deg) scale(1); filter: hue-rotate(0deg); }
  50% { transform: rotate(180deg) scale(1.15); filter: hue-rotate(180deg); }
  100% { transform: rotate(360deg) scale(1); filter: hue-rotate(360deg); }
}

@keyframes sparkle-rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.anim-float { animation: float 3.5s ease-in-out infinite; }
.anim-egg { animation: egg-wobble 2.2s ease-in-out infinite; }
.anim-pulse { animation: pulse-glow 2.5s ease-in-out infinite; }
.anim-super { animation: super-aura 6s linear infinite; }
.anim-sparkle { animation: sparkle-rotate 12s linear infinite; }

.eye-blink {
  transform-origin: center;
  transform-box: fill-box;
  animation: blink 4s infinite;
}

.tentacle {
  transform-origin: top center;
  transform-box: fill-box;
  animation: tentacle-sway var(--speed, 2.5s) ease-in-out infinite;
  animation-delay: var(--delay, 0s);
}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs>
            <linearGradient id="legGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fef08a"/>
              <stop offset="40%" stop-color="#f59e0b"/>
              <stop offset="100%" stop-color="#b45309"/>
            </linearGradient>
            <filter id="goldGlow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="10" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
          </defs>
          <!-- Halo Ring -->
          <ellipse cx="100" cy="50" rx="85" ry="20" fill="none" stroke="#fbbf24" stroke-width="4" stroke-dasharray="8 6" class="anim-sparkle" transform-origin="100 50"/>
          <!-- Inner Glow Backing -->
          <circle cx="100" cy="90" r="80" fill="#f59e0b" opacity="0.25" class="anim-pulse"/>
          <!-- Golden Tentacles -->
          <g>
            <path class="tentacle" style="--delay:0s;" d="M35,125 C10,175 40,210 30,240" fill="none" stroke="#fbbf24" stroke-width="9" stroke-linecap="round"/>
            <path class="tentacle" style="--delay:0.2s;" d="M60,130 C45,185 70,215 65,245" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
            <path class="tentacle" style="--delay:0.4s;" d="M85,135 C80,190 95,220 90,250" fill="none" stroke="#fef08a" stroke-width="9" stroke-linecap="round"/>
            <path class="tentacle" style="--delay:0.6s;" d="M115,135 C120,190 105,220 110,250" fill="none" stroke="#fef08a" stroke-width="9" stroke-linecap="round"/>
            <path class="tentacle" style="--delay:0.8s;" d="M140,130 C155,185 130,215 135,245" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
            <path class="tentacle" style="--delay:1.0s;" d="M165,125 C190,175 160,210 170,240" fill="none" stroke="#fbbf24" stroke-width="9" stroke-linecap="round"/>
          </g>
          <!-- Legendary Golden Shell Body -->
          <path d="M20,90 C20,10 50,5 100,5 C150,5 180,10 180,90 C180,126 150,130 130,120 C112,112 88,112 70,120 C50,130 20,126 20,90 Z" 
                fill="url(#legGrad)" stroke="#ffffff" stroke-width="3" filter="url(#goldGlow)"/>
          <!-- Royal Crown -->
          <path d="M65,15 L78,-10 L100,5 L122,-10 L135,15 Z" fill="#fef08a" stroke="#b45309" stroke-width="2"/>
          <circle cx="100" cy="-2" r="5" fill="#ef4444"/>
          <circle cx="78" cy="-14" r="3.5" fill="#38bdf8"/>
          <circle cx="122" cy="-14" r="3.5" fill="#38bdf8"/>
          <!-- Majestic Eyes -->
          <g class="eye-blink">
            <circle cx="70" cy="78" r="12" fill="#0f172a"/>
            <circle cx="74" cy="73" r="5" fill="#fff"/>
            <circle cx="130" cy="78" r="12" fill="#0f172a"/>
            <circle cx="134" cy="73" r="5" fill="#fff"/>
          </g>
          <!-- Smile -->
          <path d="M86,92 Q100,106 114,92" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
        </svg>
      