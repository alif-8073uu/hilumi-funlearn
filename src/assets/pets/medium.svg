
        <svg xmlns="http://www.w3.org/2000/svg" class="anim-float" viewBox="-20 -35 260 325" width="180" height="210">
          <style>
@keyframes float {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-14px) rotate(2deg); }
}

@keyframes pulse-glow {
  0%, 100% { opacity: 0.4; transform: scale(0.96); }
  50% { opacity: 0.85; transform: scale(1.08); }
}

@keyframes egg-wobble {
  0%, 100% { transform: rotate(0deg) scale(1); }
  25% { transform: rotate(-6deg) scale(1.02); }
  75% { transform: rotate(6deg) scale(0.98); }
}

@keyframes tentacle-sway {
  0%, 100% { transform: rotate(-8deg); }
  50% { transform: rotate(8deg); }
}

@keyframes blink {
  0%, 94%, 100% { transform: scaleY(1); }
  97% { transform: scaleY(0.1); }
}

@keyframes super-aura {
  0% { transform: rotate(0deg) scale(1); filter: hue-rotate(0deg); }
  50% { transform: rotate(180deg) scale(1.15); filter: hue-rotate(180deg); }
  100% { transform: rotate(360deg) scale(1); filter: hue-rotate(360deg); }
}

@keyframes sparkle-rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.anim-float { animation: float 3.5s ease-in-out infinite; }
.anim-egg { animation: egg-wobble 2.2s ease-in-out infinite; }
.anim-pulse { animation: pulse-glow 2.5s ease-in-out infinite; }
.anim-super { animation: super-aura 6s linear infinite; }
.anim-sparkle { animation: sparkle-rotate 12s linear infinite; }

.eye-blink {
  transform-origin: center;
  transform-box: fill-box;
  animation: blink 4s infinite;
}

.tentacle {
  transform-origin: top center;
  transform-box: fill-box;
  animation: tentacle-sway var(--speed, 2.5s) ease-in-out infinite;
  animation-delay: var(--delay, 0s);
}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs>
            <linearGradient id="medGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#c084fc"/>
              <stop offset="50%" stop-color="#a855f7"/>
              <stop offset="100%" stop-color="#6366f1"/>
            </linearGradient>
            <filter id="glowMed" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="6" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>
          <!-- Aura Background -->
          <circle cx="100" cy="100" r="75" fill="#a855f7" opacity="0.15" class="anim-pulse"/>
          <!-- Outer Wavy Tentacles -->
          <g>
            <path class="tentacle" style="--delay:0s;" d="M55,135 Q35,180 60,215 Q75,230 65,240" fill="none" stroke="#c084fc" stroke-width="7" stroke-linecap="round"/>
            <path class="tentacle" style="--delay:0.3s;" d="M82,140 Q70,185 85,220" fill="none" stroke="#a855f7" stroke-width="7" stroke-linecap="round"/>
            <path class="tentacle" style="--delay:0.6s;" d="M118,140 Q130,185 115,220" fill="none" stroke="#a855f7" stroke-width="7" stroke-linecap="round"/>
            <path class="tentacle" style="--delay:0.9s;" d="M145,135 Q165,180 140,215 Q125,230 135,240" fill="none" stroke="#c084fc" stroke-width="7" stroke-linecap="round"/>
          </g>
          <!-- Bell Body -->
          <path d="M30,100 C30,30 60,20 100,20 C140,20 170,30 170,100 C170,126 145,130 128,122 C112,115 88,115 72,122 C55,130 30,126 30,100 Z" 
                fill="url(#medGrad)" stroke="#7e22ce" stroke-width="3" filter="url(#glowMed)"/>
          <!-- Inner Pattern Lines -->
          <path d="M60,35 Q100,55 140,35" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
          <path d="M50,65 Q100,85 150,65" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2"/>
          <!-- Eyes -->
          <g class="eye-blink">
            <circle cx="75" cy="85" r="10" fill="#0f172a"/>
            <circle cx="78" cy="80" r="4" fill="#fff"/>
            <circle cx="125" cy="85" r="10" fill="#0f172a"/>
            <circle cx="128" cy="80" r="4" fill="#fff"/>
          </g>
          <!-- Smile -->
          <path d="M90,95 Q100,106 110,95" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
          <!-- Crown Tiara Gem -->
          <path d="M90,20 L100,5 L110,20 Z" fill="#fbbf24"/>
          <circle cx="100" cy="18" r="4" fill="#ef4444"/>
        </svg>
      